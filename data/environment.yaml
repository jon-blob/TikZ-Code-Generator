  - pip
  - texlive-core
  - poppler

  - pip:
      - datasets==5.0.0
      - multiprocess==0.70.17
      - dill==0.4.1
      - pyarrow==25.0.0
      - pandas
      - numpy
      - pillow
      - tqdm
      - requests
      - transformers
      - tokenizers
      - sentencepiece
      - protobuf
      - torch
      - scikit-learn
      - matplotlib
      - umap-learn