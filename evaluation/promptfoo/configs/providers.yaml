- id: http
  label: "gemma4:31b-it-q4_K_M"
  config: &ollama_config
    url: "http://127.0.0.1:8444/generate"
    method: POST
    timeout: 900000
    maxRetries: 0
    validateStatus: "status >= 200 && status < 300"
    transformResponse: &ollama_transform |
      ({
        output: json.output ?? "",
        metadata: {
          thinking_length: Number(json.thinking_length ?? 0)
        }
      })
    multipart:
      parts:
        - &ollama_image
          kind: file
          name: image
          filename: input.png
          contentType: image/png
          source:
            type: path
            path: "{{reference_image}}"

        - &ollama_description
          kind: file
          name: llm_description
          filename: description.txt
          contentType: text/plain
          source:
            type: path
            path: "{{llm_description}}"

        - &ollama_prompt
          kind: field
          name: prompt
          value: "{{prompt}}"

        - &ollama_use_description
          kind: field
          name: use_llm_description
          value: "false"

        - &ollama_debug
          kind: field
          name: debug
          value: "true"

        - kind: field
          name: model
          value: "gemma4:31b-it-q4_K_M"

        - &ollama_think
          kind: field
          name: think
          value: "false"

        - &ollama_num_predict
          kind: field
          name: num_predict
          value: "8192"

        - &ollama_num_ctx
          kind: field
          name: num_ctx
          value: "16384"

        - &ollama_thinking_multiplier
          kind: field
          name: thinking_token_multiplier
          value: "5"

