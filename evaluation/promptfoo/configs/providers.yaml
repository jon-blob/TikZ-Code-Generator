- id: http
  label: geotikzbridge-8b
  config:
    url: "http://127.0.0.1:8007/geotikzbridge"
    method: POST
    timeout: 900000
    validateStatus: "status >= 200 && status < 300"
    transformResponse: "json.tikz"
    multipart:
      parts:
        - kind: file
          name: image
          filename: input.png
          contentType: image/png
          source:
            type: path
            path: "{{input_image}}"

        - kind: file
          name: llm_description
          filename: description.txt
          contentType: text/plain
          source:
            type: path
            path: "{{llm_description}}"

        - kind: field
          name: prompt
          value: "{{prompt}}"

        - kind: field
          name: use_llm_description
          value: "false"

        - kind: field
          name: debug
          value: "true"

